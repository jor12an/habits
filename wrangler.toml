# Cloudflare Workers static assets — deploys ONLY ./public (never node_modules)
# Dashboard deploy command should be: npx wrangler deploy
name = "habits"
compatibility_date = "2026-07-24"

[assets]
directory = "./public"
# Avoid SPA rewrites that Safari service workers treat as redirects
not_found_handling = "none"
# Do not bundle node_modules; assets dir is public/ only
